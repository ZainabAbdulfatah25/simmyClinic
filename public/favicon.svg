<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="6" />

  <!-- Outer Pulse Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#heartGrad)" stroke-width="4" opacity="0.4" stroke-dasharray="12 8" />

  <!-- Medical Cross & Stethoscope Heart Badge -->
  <g transform="translate(0, 10)">
    <!-- Heart Shape Path -->
    <path d="M256 420 C240 405, 120 310, 120 205 C120 145, 165 105, 220 105 C242 105, 256 120, 256 120 C256 120, 270 105, 292 105 C347 105, 392 145, 392 205 C392 310, 272 405, 256 420 Z" 
          fill="url(#heartGrad)" filter="url(#glow)" />

    <!-- Pulse ECG Line Inside Heart -->
    <path d="M 160 215 L 205 215 L 225 170 L 245 260 L 265 190 L 285 230 L 305 215 L 352 215" 
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Clean Accent Dot -->
    <circle cx="340" cy="140" r="14" fill="#10b981" stroke="#0f172a" stroke-width="4" />
  </g>
</svg>
